<!-- Note: Please don't play the game on a phone-shaped screen. I tried to fix it. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Invaders HTML5</title>
  <script src="script/aspect-ratio.js"></script> <!-- Apply aspect-ratio fixer -->
  <script src="script/entities.js"></script> <!-- Define entity classes -->
  <script src="script/game.js"></script> <!-- Call main game -->
  <link rel="stylesheet" href="style/style.css" />
  <style>
    div#display-out {
      position: absolute;
      aspect-ratio: 8 / 7;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 3px solid white;
    }
    div#game {
      display: inline-block;
      width: 60%; /* To make space for screen size changes */
      height: 100%;
      transform: translateX(4.3%);
    }
    div#stats {
      float: right;
      width: 35%;
      height: 100%;
      border: 3px solid white;
      border-width: 0 0 0 3px;
    }
    div#stocks, div#level {
      margin-bottom: 10vh;
    }
    label#score-header, label#high-score-header {
      text-align: left;
    }
    label#score-value, label#high-score-value {
      text-align: right;
      margin-bottom: 10vh;
    }
    div#stock-images, div#level-images, label#stock-count {
      display: inline;
    }
  </style>
</head>
<body>
  <div id="display-out">
    <div id="game"></div>
    <div id="stats">
      <label id="score-header">Score</label>
      <label id="score-value">000000</label>
      <label id="high-score-header">Hi-Score</label>
      <label id="high-score-value">000000</label>
      <div id="stocks">
        <label id="stock-count">0</label>
        <div id="stock-images"></div>
      </div>
      <div id="level">
        <label id="level-count">0</label>
        <div id="level-images"></div>
      </div>
    </div>
  </div>
</body>
</html>
