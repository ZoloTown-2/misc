<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Invaders HTML5</title>
  <script src="script/aspect-ratio.js"></script>
  <style>
    html {
      width: 90%;
      height: 90%;
    }
    body {
      background-color: #101010;
    }
    div#display-out {
      position: absolute;
      aspect-ratio: 8 / 7;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid white;
    }
    div#stats {
      float: right;
      width: 35%;
      height: 100%;
      border: 1px solid white;
      border-width: 0 0 0 1px;
    }
    div#stocks, div#level {
      margin-bottom: 12vh;
    }
    label {
      color: white;
      font-size: 2vw;
      position: relative;
      display: block;
      margin: 2vh;
    }
    label#score-header, label#high-score-header {
      text-align: left;
    }
    label#score-value, label#high-score-value {
      text-align: right;
      margin-bottom: 12vh;
    }
    div#stock-images, div#level-images, label#stock-count {
      display: inline;
    }
  </style>
</head>
<body>
  <div id="display-out">
    <div id="stats">
      <label id="score-header">Score</label>
      <label id="score-value">000000</label>
      <label id="high-score-header">Hi-Score</label>
      <label id="high-score-value">000000</label>
      <div id="stocks">
        <label id="stock-count">0</label>
        <div id="stock-images"></div>
      </div>
      <div id="level">
        <label id="level-count">0</label>
        <div id="level-images"></div>
      </div>
    </div>
  </div>
</body>
</html>
